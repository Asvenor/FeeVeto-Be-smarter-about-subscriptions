name: Test and deploy FeeVeto

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run automated checks
        run: npm run check

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Pages
        uses: actions/configure-pages@v6
      - name: Prepare public site
        run: |
          mkdir -p _site/js _site/data
          cp index.html privacy.html style.css favicon.svg robots.txt sitemap.xml _site/
          cp js/*.js _site/js/
          cp data/*.js _site/data/
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
